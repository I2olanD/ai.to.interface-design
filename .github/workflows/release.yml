name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write  # npm provenance via GitHub OIDC

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${NEW_VERSION} (${BUMP} bump)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm is only used for the publish steps: `bun publish` has no --provenance flag.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'  # Node LTS (matches mise.toml); prototype requires >=22, CLI >=18
          registry-url: 'https://registry.npmjs.org'

      # Gate the release on tests BEFORE any version bump/tag/publish.
      - name: Test CLI
        working-directory: packages/design-token-extractor
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run test

      - name: Test prototype
        working-directory: packages/prototype
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Update version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" .claude-plugin/marketplace.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" plugin/.claude-plugin/plugin.json
          ( cd packages/design-token-extractor && bun pm version "${VERSION}" --no-git-tag-version --allow-same-version )
          ( cd packages/prototype && bun pm version "${VERSION}" --no-git-tag-version --allow-same-version )

      # Rebuild the prototype runtime and repin its SRI hash in the skill so the
      # served bytes and the hash the skill injects stay in lockstep.
      - name: Build prototype and repin SRI hash
        run: |
          ( cd packages/prototype && bun run build )
          HASH="sha384-$(openssl dgst -sha384 -binary packages/prototype/dist/prototype.min.js | openssl base64 -A)"
          echo "prototype.min.js integrity: ${HASH}"
          sed -i -E "s#sha384-[A-Za-z0-9+/=]+#${HASH}#g" \
            plugin/skills/prototype/SKILL.md \
            plugin/skills/prototype/references/dom-contract-v1.md

      # Bookkeeping is skipped outright when the tag is already there, so a
      # re-run of a release that died after tagging proceeds to publish instead
      # of failing on `tag already exists` and wedging the version forever.
      - name: Commit, tag, and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already committed and tagged; skipping bookkeeping."
            exit 0
          fi
          git add .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json \
            packages/design-token-extractor/package.json \
            packages/prototype/package.json \
            plugin/skills/prototype/SKILL.md \
            plugin/skills/prototype/references/dom-contract-v1.md
          git commit -m "chore: release v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Build CLI
        working-directory: packages/design-token-extractor
        run: bun run build

      # Publishing stays on npm: `bun publish` has no --provenance flag.
      # Skipping an already-published version keeps re-runs from failing on 409.
      - name: Publish CLI to npm
        working-directory: packages/design-token-extractor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="$(bun pm pkg get name | tr -d '"')"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; skipping."
          else
            npm publish --provenance
          fi

      - name: Publish prototype to npm
        working-directory: packages/prototype
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="$(bun pm pkg get name | tr -d '"')"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; skipping."
          else
            npm publish --provenance
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi
